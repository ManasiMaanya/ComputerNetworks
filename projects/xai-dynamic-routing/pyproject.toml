[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-dynamic-routing"
version = "0.1.0"
description = "Explainable AI-based dynamic routing recommendation system (Title 4 capstone)."
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "shap>=0.45",
    "lime>=0.2.0",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["src*", "web*"]
